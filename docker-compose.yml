# docker-compose.yml
# PostgreSQL + pgAdmin para ambiente de desenvolvimento

services:

  postgres:
    image: postgres:16-alpine
    container_name: postgres-grafiti-classification-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: grafiti_classification_db
      # O banco "grafiti_classification_db" é criado automaticamente na primeira vez.
    ports:
      - "5432:5432"
      # Expõe a porta 5432 do container na porta 5432 do Windows.
      # A API .NET conecta via localhost:5432.
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      # Persiste os dados mesmo ao parar/reiniciar o container.
    networks:
      - rede-db

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-final
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
      # Acesse o pgAdmin em: http://localhost:8080
    depends_on:
      - postgres
    networks:
      - rede-db

  minio:
    image: minio/minio:latest
    container_name: minio-graffiti-storage
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"  # API MinIO
      - "9001:9001"  # Console Web
    volumes:
      - dados-minio:/data
    command: server /data --console-address ":9001"
    networks:
      - rede-db

volumes:
  dados-postgres:
  dados-minio:

networks:
  rede-db:
    driver: bridge